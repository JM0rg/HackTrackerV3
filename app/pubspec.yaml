name: hacktracker
description: Slowpitch softball stat tracker.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  path_provider: ^2.1.5
  path: ^1.9.1
  supabase_flutter: ^2.10.3
  uuid: ^4.5.1
  share_plus: ^11.1.0
  intl: ^0.20.2
  connectivity_plus: ^6.1.5
  collection: ^1.19.1
  sqlite3_flutter_libs: 0.5.41
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.2
  build_runner: ^2.4.15

dependency_overrides:
  # 0.5.42 needs CocoaPods sqlite3 3.52, which trunk caches often lack.
  sqlite3_flutter_libs: 0.5.41

flutter:
  uses-material-design: true
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
